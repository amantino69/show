{% extends "base.html" %}

{% block title %}Cadastro — Viezes{% endblock %}
{% block body_class %}page-auth{% endblock %}

{% block content %}
<div class="auth-shell">
    <div class="auth-card card border-0">
        <div class="card-header auth-brand">
            <img src="{{ url_for('static', filename='img/viezes-mark.svg') }}" alt="" class="brand-mark" width="64" height="64">
            <div class="brand-wordmark">viezes<span class="co">.co</span></div>
            <div class="brand-tagline">Assessoria de carreiras</div>
        </div>
        <div class="card-body">
            <h5 class="text-center mb-4" style="font-family: var(--font-display);">Criar conta</h5>
            <form method="POST">
                <div class="mb-3">
                    <label for="username" class="form-label small text-muted">Usuário</label>
                    <input type="text" class="form-control" id="username" name="username" required>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label small text-muted">E-mail</label>
                    <input type="email" class="form-control" id="email" name="email" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label small text-muted">Senha</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                </div>
                <div class="mb-4">
                    <label for="user_type" class="form-label small text-muted">Tipo de conta</label>
                    <select class="form-select" id="user_type" name="user_type" required>
                        <option value="">Selecione...</option>
                        <option value="manager">Equipe Viezes</option>
                        <option value="artist">Assessorado</option>
                    </select>
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary btn-lg">
                        <i class="fas fa-user-plus me-2"></i>Cadastrar
                    </button>
                </div>
            </form>
            <hr class="my-4">
            <p class="text-center small text-muted mb-0">
                Já tem conta? <a href="{{ url_for('auth.login') }}">Faça login</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_css %}
<style>
    body { background: var(--vz-espresso) !important; }
    body.page-auth .main-content { background: transparent !important; padding: 0 !important; }
</style>
{% endblock %}
