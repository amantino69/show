{% extends "base.html" %}
{% block page_title %}Cadastros{% endblock %}
{% block content %}
<div class="row mb-4">
    <div class="col-12">
        <h2><i class="fas fa-list-alt me-2"></i>Cadastros</h2>
        <p class="text-muted">Opções usadas nos formulários de CRM e assessorados.</p>
    </div>
</div>
<div class="row">
    {% for cat in categories %}
    <div class="col-md-4 mb-3">
        <div class="card h-100">
            <div class="card-body">
                <h5 class="card-title">{{ cat.label }}</h5>
                <p class="card-text text-muted">{{ cat.count }} opção(ões) ativa(s)</p>
                <a href="{{ url_for('catalog.list_items', category=cat.key) }}" class="btn btn-primary btn-sm">
                    Gerenciar
                </a>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
