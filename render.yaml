services:
  - type: web
    name: show
    runtime: python
    plan: free
    buildCommand: ./build.sh
    releaseCommand: python scripts/release_setup.py
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: SEED_DEMO_ON_START
        value: "false"
